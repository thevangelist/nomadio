<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: sys; src: local("SF Pro Display"), local("Helvetica Neue"); }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 2400px; height: 1350px;
    background: #000;
    font-family: "SF Pro Display", ui-sans-serif, -apple-system, system-ui, sans-serif;
    color: #fafafa;
    overflow: hidden;
    position: relative;
  }

  /* Brand glow: two wide radials, screened over black so they read as light
     rather than as painted shapes. Deliberately far below the mark's contrast. */
  .glow {
    position: absolute; inset: 0;
    mix-blend-mode: screen;
    background:
      radial-gradient(1200px 1000px at 14% 40%, rgba(157, 140, 255, 0.26), transparent 62%),
      radial-gradient(900px 800px at 78% 74%, rgba(255, 159, 67, 0.10), transparent 60%),
      radial-gradient(1400px 1000px at 62% 12%, rgba(157, 140, 255, 0.07), transparent 65%);
    filter: blur(6px);
  }

  .grid {
    position: relative;
    display: grid;
    grid-template-columns: 2fr 1fr;
    height: 100%;
    align-items: center;
    padding: 0 150px;
    gap: 90px;
  }

  .left { display: grid; gap: 58px; }
  .mark { width: 168px; color: #fafafa; }
  .mark svg { width: 100%; height: auto; display: block; }
  h1 {
    font-size: 132px; font-weight: 600; letter-spacing: -0.02em; line-height: 1;
  }
  h1 em { font-style: normal; color: #9d8cff; }
  p.tag {
    font-size: 44px; font-weight: 400; line-height: 1.35; color: #a1a1a1; max-width: 20ch;
  }
  p.tag strong { color: #fafafa; font-weight: 500; }
  .meta {
    display: flex; gap: 40px; align-items: center;
    font-size: 26px; color: #6e6e6e; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .meta i { width: 10px; height: 10px; background: #9d8cff; display: inline-block; margin-right: 12px; }

  /* Phone: a frame, not a photo — one bezel, one radius, no fake reflections. */
  .phone {
    position: relative;
    width: 555px; aspect-ratio: 390 / 844;
    border-radius: 68px;
    padding: 14px;
    background: #1f1f1f;
    box-shadow:
      0 0 0 2px #3d3d3d,
      0 80px 160px rgba(0, 0, 0, 0.8),
      0 0 180px rgba(157, 140, 255, 0.16);
    justify-self: end;
  }
  .phone .screen {
    width: 100%; height: 100%;
    border-radius: 54px;
    overflow: hidden;
    background: #0a0a0a;
  }
  .phone img { width: 100%; display: block; }
  .phone .notch {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    width: 160px; height: 34px; border-radius: 20px; background: #000;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid">
    <div class="left">
      <div class="mark">MARK</div>
      <div>
        <h1>Nomad<em>IO</em></h1>
        <p class="tag" style="margin-top: 34px">
          <strong>I/O for creators on the move.</strong>
          Know whether your stream is actually live, from the receiving end.
        </p>
      </div>
      <div class="meta"><span><i></i>Live monitoring</span><span>SRT ingest</span><span>Self-hosted</span></div>
    </div>
    <div class="phone">
      <div class="screen"><img src="../docs/screenshot-mobile.png"></div>
        </div>
  </div>
  <script>
    document.querySelector('.mark').innerHTML = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 336 336\" fill=\"none\" role=\"img\" aria-label=\"NomadIO\">\n  <title>NomadIO</title>\n  <g fill=\"currentColor\">\n    <path d=\"M64 0L64 38L270 279L270 24L238 25L238 200Z\"/>\n    <path d=\"M64 56L64 312L98 312L98 135L270 335L270 295Z\"/>\n  </g>\n</svg>\n";
  </script>
</body>
</html>
