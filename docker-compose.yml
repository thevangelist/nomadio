services:
  # The thing that actually receives the phone's stream. OBS pulls from it,
  # NomadIO reads its stats. Skip this service if you already run an ingest.
  ingest:
    image: bluenviron/mediamtx:latest
    environment:
      # MediaMTX does not expand ${...} inside its config file; these MTX_ variables
      # override the second authInternalUsers entry, which is the publisher.
      MTX_AUTHINTERNALUSERS_1_USER: ${INGEST_USER:-nomad}
      MTX_AUTHINTERNALUSERS_1_PASS: ${INGEST_PASS:?set INGEST_PASS in .env}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - '8890:8890/udp'   # SRT
      - '1935:1935'       # RTMP
      - '9997:9997'       # stats API, read by the backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      STREAM_PROVIDER: ${STREAM_PROVIDER:-mediamtx}
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://ingest:9997}
    depends_on: [ingest]
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports: ['3000:80']
    depends_on: [backend]
    restart: unless-stopped
